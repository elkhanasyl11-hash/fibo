# Tool configuration for the AI client copy and its tests (ruff + pytest). Run from ai/.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["fibo_ai", "fibo_ai_client", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies in default arguments are the framework's idiom, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# Long Field descriptions / examples and LLM prompt texts: one string per line, easier to read than wrapped.
"fibo_ai/schemas/*.py" = ["E501"]
"fibo_ai/assistant/service.py" = ["E501"]
"fibo_ai/audio/descriptors.py" = ["E501"]
# TODO: real (small) issue kept on record — blocking pathlib calls inside async handlers; move to asyncio.to_thread.
"fibo_ai/facade.py" = ["ASYNC240"]
"fibo_ai/rag/service.py" = ["ASYNC240"]
