<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050d1c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fibo — контроль качества продукции, состояние оборудования и производственные показатели в едином интерфейсе" />
    <title>Fibo — контроль производства</title>
    <script>
      // Theme before the first paint (no flash): stored Light/Dark/System, dark by default.
      ;(function () {
        var theme = "dark"
        try {
          theme = localStorage.getItem("fibo.theme") || "dark"
        } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
